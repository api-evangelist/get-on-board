openapi: 3.2.0
info:
  title: Get on Board Industries API
  version: 0.1.0
  description: The Get on Board API provides access to the data inside Get on Board, the leading recruitment platform for tech professionals in Latin America.
servers:
- url: https://www.getonbrd.com
  description: Production
- url: https://sandbox.getonbrd.dev
  description: Sandbox
tags:
- name: Industries
  description: Industry classifications
paths:
  /api/v0/industries:
    get:
      summary: List industries
      tags:
      - Industries
      responses:
        '200':
          description: Returns all available industries with optional pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            code:
                              type: integer
                            label:
                              type: string
                            description: {}
                          required:
                          - code
                          - label
                          - description
                      required:
                      - id
                      - type
                      - attributes
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total_pages
                required:
                - data
                - meta
              example:
                data:
                - id: '1'
                  type: industry
                  attributes:
                    code: 201
                    label: Farming, Ranching, Forestry
                    description: null
                - id: '1'
                  type: industry
                  attributes:
                    code: 201
                    label: Farming, Ranching, Forestry
                    description: null
                - id: '1'
                  type: industry
                  attributes:
                    code: 201
                    label: Farming, Ranching, Forestry
                    description: null
                - id: '1'
                  type: industry
                  attributes:
                    code: 201
                    label: Farming, Ranching, Forestry
                    description: null
                meta:
                  page: 1
                  per_page: 120
                  total_pages: 1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        example: 2
        description: Page number, starting at 1.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 120
        example: 1
        description: Number of records per page. The default and maximum are usually 120 unless an endpoint documents a different behavior.
      operationId: listIndustries
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Company authentication for private endpoints. Send `Authorization: Bearer <api_key>`.'
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Professional JWT token obtained via /api/v0/auth_tokens
    BoardSecretKey:
      type: http
      scheme: bearer
      bearerFormat: Board secret
      description: 'Board+ HMAC secret key. Send `Authorization: Bearer <board_secret_key>`. The legacy query-string form (`?secret_key=...`) is still accepted by the server but is discouraged because secrets leak into logs, browser history, and referrers.'
x-tagGroups:
