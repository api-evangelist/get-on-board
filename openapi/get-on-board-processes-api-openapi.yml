  /api/v0/processes/{process_id}/phases:
    get:
      summary: List process phases
      tags:
      - Processes
      security:
      - ApiKeyAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer YOUR_API_KEY
        description: Bearer credential for the authentication scheme required by this endpoint.
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        example: 5
        description: Hiring process ID from `GET /api/v0/processes` or `GET /api/v0/jobs/{job_id}/processes`.
      responses:
        '200':
          description: Returns the ordered phases for a hiring process, including phase kind metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            title:
                              type: string
                            position:
                              type: integer
                            kind:
                              type: string
                            reserved:
                              type: boolean
                            created_at:
                              type: integer
                            updated_at:
                              type: integer
                          required:
                          - title
                          - position
                          - kind
                          - reserved
                          - created_at
                          - updated_at
                      required:
                      - id
                      - type
                      - attributes
                required:
                - data
              example:
                data:
                - id: '101'
                  type: phase
                  attributes:
                    title: Applicants
                    position: 1
                    kind: applicants
                    reserved: true
                    created_at: 1778175360
                    updated_at: 1778175360
                - id: '102'
                  type: phase
                  attributes:
                    title: Selected
                    position: 2
                    kind: regular
                    reserved: false
                    created_at: 1778175360
                    updated_at: 1778175360
                - id: '103'
                  type: phase
                  attributes:
                    title: Hired
                    position: 3
                    kind: hires
                    reserved: true
                    created_at: 1778175360
                    updated_at: 1778175360
                - id: '104'
                  type: phase
                  attributes:
                    title: Discarded
                    position: 4
                    kind: discarded
                    reserved: true
                    created_at: 1778175360
                    updated_at: 1778175360
        '401':
          description: Returns the ordered phases for a hiring process, including phase kind metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                required:
                - message
                - code
              example:
                message: (Status 401) Unauthorized access to the API
                code: unauthorized
        '404':
          description: Returns the ordered phases for a hiring process, including phase kind metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                required:
                - message
                - code
              example:
                message: Record not found
                code: not_found
      operationId: listProcessPhases
      description: 'Use each returned phase `id` as `phase_id` in `PATCH /api/v0/applications/{application_id}/phase`. If the chosen phase has `kind: "discarded"`, also send a valid `discard_reason`.'
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Company authentication for private endpoints. Send `Authorization: Bearer <api_key>`.'
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Professional JWT token obtained via /api/v0/auth_tokens
    BoardSecretKey:
      type: http
      scheme: bearer
      bearerFormat: Board secret
      description: 'Board+ HMAC secret key. Send `Authorization: Bearer <board_secret_key>`. The legacy query-string form (`?secret_key=...`) is still accepted by the server but is discouraged because secrets leak into logs, browser history, and referrers.'
