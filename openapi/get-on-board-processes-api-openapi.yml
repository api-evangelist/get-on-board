openapi: 3.2.0
info:
  title: Get on Board Processes API
  version: 0.1.0
  description: The Get on Board API provides access to the data inside Get on Board, the leading recruitment platform for tech professionals in Latin America.
servers:
- url: https://www.getonbrd.com
  description: Production
- url: https://sandbox.getonbrd.dev
  description: Sandbox
tags:
- name: Processes
  description: Hiring process management
paths:
  /api/v0/processes:
    get:
      summary: List processes
      tags:
      - Processes
      security:
      - ApiKeyAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer YOUR_API_KEY
        description: Bearer credential for the authentication scheme required by this endpoint.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        example: 2
        description: Page number, starting at 1.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 120
        example: 2
        description: Number of records per page. The default and maximum are usually 120 unless an endpoint documents a different behavior.
      responses:
        '200':
          description: Returns a paginated list of hiring processes for the authenticated company.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            active:
                              type: boolean
                            unlocked:
                              type: boolean
                            featured:
                              type: boolean
                            expires_on:
                              type: integer
                            created_at:
                              type: integer
                            updated_at:
                              type: integer
                            featured_at:
                              type: integer
                            closed_at:
                              type: integer
                            job:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                    type:
                                      type: string
                                  required:
                                  - id
                                  - type
                              required:
                              - data
                            phases:
                              type: object
                              properties:
                                data:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      id:
                                        type: integer
                                      type:
                                        type: string
                                    required:
                                    - id
                                    - type
                              required:
                              - data
                          required:
                          - active
                          - unlocked
                          - featured
                          - expires_on
                          - created_at
                          - updated_at
                          - featured_at
                          - closed_at
                          - job
                          - phases
                      required:
                      - id
                      - type
                      - attributes
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total_pages
                required:
                - data
                - meta
              example:
                data:
                - id: '1'
                  type: process
                  attributes:
                    active: true
                    unlocked: true
                    featured: false
                    expires_on: 0
                    created_at: 1784217403
                    updated_at: 1784217404
                    featured_at: 0
                    closed_at: 0
                    job:
                      data:
                        id: 310
                        type: job
                    phases:
                      data:
                      - id: 965
                        type: phase
                      - id: 966
                        type: phase
                      - id: 967
                        type: phase
                      - id: 968
                        type: phase
                - id: '1'
                  type: process
                  attributes:
                    active: true
                    unlocked: true
                    featured: false
                    expires_on: 0
                    created_at: 1784217404
                    updated_at: 1784217404
                    featured_at: 0
                    closed_at: 0
                    job:
                      data:
                        id: 311
                        type: job
                    phases:
                      data:
                      - id: 969
                        type: phase
                      - id: 970
                        type: phase
                      - id: 971
                        type: phase
                      - id: 972
                        type: phase
                - id: '1'
                  type: process
                  attributes:
                    active: true
                    unlocked: true
                    featured: false
                    expires_on: 0
                    created_at: 1784217404
                    updated_at: 1784217404
                    featured_at: 0
                    closed_at: 0
                    job:
                      data:
                        id: 312
                        type: job
                    phases:
                      data:
                      - id: 973
                        type: phase
                      - id: 974
                        type: phase
                      - id: 975
                        type: phase
                      - id: 976
                        type: phase
                meta:
                  page: 1
                  per_page: 120
                  total_pages: 1
        '401':
          description: Returns a paginated list of hiring processes for the authenticated company.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                required:
                - message
                - code
              example:
                message: (Status 401) Unauthorized access.
                code: unauthorized
      operationId: listProcesses
