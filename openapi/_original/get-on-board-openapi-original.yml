      responses:
        '200':
          description: Returns all webhook endpoints for the authenticated subscriber.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            endpoint:
                              type: string
                            state:
                              type: string
                            events:
                              type: array
                              items:
                                type: string
                          required:
                          - endpoint
                          - state
                          - events
                      required:
                      - id
                      - type
                      - attributes
                required:
                - data
              example:
                data:
                - id: '1'
                  type: webhook_endpoint
                  attributes:
                    endpoint: https://hooks.example.com/b
                    state: active
                    events:
                    - job.match
                - id: '1'
                  type: webhook_endpoint
                  attributes:
                    endpoint: https://hooks.example.com/a
                    state: active
                    events:
                    - job.match
