    post:
      summary: Create a webhook endpoint
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer YOUR_JWT_TOKEN
        description: Bearer credential for the authentication scheme required by this
          endpoint.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                events:
                  type: array
                  items:
                    type: string
              required:
              - endpoint
              - events
            example:
              endpoint: https://hooks.example.com/a
              events:
              - job.match
              - job.match
      responses:
        '200':
          description: Creates a new webhook endpoint with the specified events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          endpoint:
                            type: string
                          state:
                            type: string
                          events:
                            type: array
                            items:
                              type: string
                        required:
                        - endpoint
                        - state
                        - events
                    required:
                    - id
                    - type
                    - attributes
                required:
                - data
              example:
                data:
                  id: 7032348ebd4ec817921d4bf3ef130499
                  type: webhook_endpoint
                  attributes:
                    endpoint: https://hooks.example.com/a
                    state: active
                    events:
