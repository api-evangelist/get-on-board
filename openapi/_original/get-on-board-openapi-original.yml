                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          endpoint:
                            type: string
                          state:
                            type: string
                          events:
                            type: array
                            items:
                              type: string
                        required:
                        - endpoint
                        - state
                        - events
                    required:
                    - id
                    - type
                    - attributes
                required:
                - data
              example:
                data:
                  id: 44bdd0c04e3a7cf0379403ba037fb14f
                  type: webhook_endpoint
                  attributes:
                    endpoint: https://hooks.example.com/updated
                    state: active
                    events:
                    - job.match
        '422':
          description: Updates an existing webhook endpoint's events or configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: string
                    required:
                    - events
                  code:
                    type: string
                required:
                - message
                - code
              example:
                message:
                  events:
                  - Contains one or more events that are not allowed.
                code: unprocessable_content
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                events:
                  type: array
                  items:
                    type: string
              required:
              - endpoint
              - events
            example:
              endpoint: https://hooks.example.com/updated
              events:
              - job.match
      operationId: updateWebhookEndpoint
  "/api/v0/webhook_events":
    get:
      summary: List webhook events
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Returns the available webhook event types for the authenticated
            subscriber.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            label:
                              type: string
                            description:
                              type: string
                          required:
                          - label
                          - description
                      required:
                      - id
                      - type
                      - attributes
                required:
                - data
              example:
                data:
                - id: '1'
                  type: webhook_event
                  attributes:
                    label: Job matching your preferences
                    description: A new job matching your preferences has been published
        '401':
          description: Returns the available webhook event types for the authenticated
            subscriber.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                required:
                - message
                - code
              example:
                message: "(Status 401) Unauthorized access to webhooks events"
                code: unauthorized
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer YOUR_JWT_TOKEN
        description: Bearer credential for the authentication scheme required by this
          endpoint.
      operationId: listWebhookEvents
      description: Call this before creating or updating webhook endpoints. Send only
        event IDs returned by this endpoint in the `events` array.
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Company authentication for private endpoints. Send `Authorization:
        Bearer <api_key>`.'
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Professional JWT token obtained via /api/v0/auth_tokens
    BoardSecretKey:
      type: http
      scheme: bearer
      bearerFormat: Board secret
      description: 'Board+ HMAC secret key. Send `Authorization: Bearer <board_secret_key>`.
        The legacy query-string form (`?secret_key=...`) is still accepted by the
        server but is discouraged because secrets leak into logs, browser history,
        and referrers.'
