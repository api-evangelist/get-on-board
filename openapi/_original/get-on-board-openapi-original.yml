  "/api/v0/auth_tokens":
    post:
      summary: Refresh auth token
      tags:
      - Authentication
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                refresh_token: YOUR_REFRESH_TOKEN
              required:
              - refresh_token
            example:
              refresh_token: YOUR_REFRESH_TOKEN
      responses:
        '200':
          description: Exchanges a valid refresh token for a new JWT access token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: YOUR_JWT_TOKEN
                  refresh_token: YOUR_REFRESH_TOKEN
                required:
                - token
                - refresh_token
              example:
                token: YOUR_JWT_TOKEN
                refresh_token: YOUR_REFRESH_TOKEN
        '400':
          description: Exchanges a valid refresh token for a new JWT access token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                required:
                - message
                - code
              example:
                message: 'param is missing or the value is empty or invalid: Missing
                  refresh token parameter'
                code: bad_request
        '401':
          description: Exchanges a valid refresh token for a new JWT access token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                required:
                - message
                - code
              example:
                message: "(Status 401) Refresh token expired"
                code: unauthorized
      operationId: refreshAuthToken
      description: Send a valid `refresh_token` to receive a new short-lived JWT `token`.
        Keep using the same `refresh_token` until it expires.
