      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expand:
                  type: array
                  items:
                    type: string
                questions:
                  type: array
                  items:
                    type: object
                    properties:
                      slug:
                        type: string
                      title:
                        type: string
                      kind:
                        type: string
                      id:
                        type: string
                      language:
                        type: string
                      hidden:
                        type: string
                title:
                  type: string
                description:
                  type: string
                remote_modality:
                  type: string
                  enum:
                  - no_remote
                  - temporarily_remote
                  - remote_local
                  - fully_remote
                  - hybrid
                  description: Work-location policy. Determines which location ID
                    fields are accepted.
                location_region_ids:
                  type: array
                  items:
                    type: string
                  description: For `remote_local` jobs only. Region slugs from `GET
                    /api/v0/regions`.
                location_country_ids:
                  type: array
                  items:
                    type: string
                  description: For `remote_local` jobs only. Country slugs from `GET
                    /api/v0/countries`.
                location_city_ids:
                  type: array
                  items:
                    type: integer
                  description: Required for `no_remote`, `hybrid`, and `temporarily_remote`.
                    Numeric city IDs from `GET /api/v0/cities`.
                company_shell_id:
                  type: string
                  nullable: true
                  description: Partner accounts only. Slug of one of your company
                    shells (`GET /api/v0/company_shells`) to publicly brand this job
                    as that client company. Omit for a normal job. On update, send
                    `""` to detach the shell. `404` for an unknown or foreign slug;
                    `422` if your account is not partner-enabled.
            example:
              title: Updated Ruby on Rails Developer
              description: We are updating this role with a clearer scope, stronger
                expectations, and a more complete explanation of the work the engineer
                will own.
              projects: You will keep improving our Rails application, internal APIs,
                and the workflows companies use to manage hiring.
              functions: Ship features, review pull requests, improve observability,
                and maintain a stable customer-facing API.
              min_salary: 2000
              max_salary: 2800
              perks: pet_friendly
      description: |-
        ### Remote modality and locations

        `remote_modality` controls which location fields the Jobs API reads:

        - `fully_remote`: do not send location fields. Regions, countries, and cities are cleared.
        - `remote_local`: send `location_region_ids` and/or `location_country_ids` as slugs from `GET /api/v0/regions` and `GET /api/v0/countries`.
        - `no_remote`, `hybrid`, `temporarily_remote`: send `location_city_ids` as numeric city IDs from `GET /api/v0/cities`.

        Unknown or wrong identifier types resolve to empty locations and can return `422`.
        `location_city_ids` uses city IDs, not city names, country slugs, or `tenant_city_ids`.

        ### Posting on behalf of a client brand (company shells)

        Partner accounts (typically ATS integrations posting for many client companies) can brand a job
        as one of their **company shells** instead of their own account: send `company_shell_id` with the
        shell's slug (from `GET /api/v0/company_shells`). Every public surface — job page, company profile
        link, logo, feeds, and public API — then shows the client company's identity, while applications,
        processes, and billing stay on your account. Omit the field for a normal job; on update, send `""`
        to detach the shell. See the **Company shells** section to create and manage shells.
      operationId: updateCompanyPrivateJob
