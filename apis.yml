- aid: get-on-board:get-on-board-company-shells-api
  name: Get On Board Company shells API
  description: >-
    Post jobs under your client companies' brands from a single account. A company shell is a lightweight
    public company profile (name, logo, description, its own `/companies/<slug>` page) owned by your partner
    account. Create shells for the companies you recruit for, then pass a shell's slug as `company_shell_id`
    when creating or updating a job: the public job page, company profile, feeds, and public API all show
    the client's brand, while applications, hiring processes, and billing stay on your account. Built
    for ATS integrations and agencies managing many client companies. Available to authorized partner
    accounts only — other API keys receive 403; contact Get on Board to become a partner. Not related
    to the public Companies endpoints.
  humanURL: https://www.getonbrd.com/api-doc.html
  baseURL: https://www.getonbrd.com/api/v0/
