aid: get-on-board
name: Get On Board
description: >-
  Get on Board (getonbrd.com) is the leading tech-recruitment platform and
  applicant tracking system (ATS) for Latin America, connecting companies with a
  talent database of 1M+ technology professionals. Companies post jobs, run
  structured hiring processes, and access candidate profiles. Get on Board
  publishes a public REST API (v0) with an OpenAPI 3.0 specification, a sandbox
  environment, outbound webhooks, and a first-party Ruby client library. The
  public API exposes job categories, company profiles, published jobs, and a job
  search endpoint with no authentication; a private Companies API (API-key
  authenticated, subscription-gated) covers jobs, applications, hiring processes,
  professionals, company shells, and webhook management. Surfaced as a portfolio
  company of 500 Global and enriched by the API Evangelist pipeline.
